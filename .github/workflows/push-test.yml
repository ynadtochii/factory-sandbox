name: Push test
on: workflow_dispatch
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  try-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push with no credentials
        continue-on-error: true
        run: git push origin HEAD:refs/heads/push-test-a
      - name: Push with the job token
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push origin HEAD:refs/heads/push-test-b
