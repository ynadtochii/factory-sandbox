name: Agent task
description: A small task for the agent to design, build, test, and open as a PR
labels: ["agent:implement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to tell it is done. Use checks a test can prove.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the agent must not change.
